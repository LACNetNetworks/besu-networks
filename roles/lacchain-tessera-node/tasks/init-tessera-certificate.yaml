- name: create tessera directories
  file:
    path: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    state: directory
  with_items:
    - { dest: "~/lnet/tessera/certificates", mode: "0440" }
    - { dest: "~/lnet/tessera/certificates/CAs", mode: "0440" }

- name: generate configuration openssl file
  template:
    src: "openssl.j2"
    dest: "~/lnet/tessera/openssl.cnf"
    force: yes

- name: generating CA Key
  shell: openssl genrsa -out tessera_ca.key 2048
  args:
    chdir: ~/lnet/tessera/certificates

- name: generating CA Certificate
  shell: openssl req -x509 -new -nodes -key /root/lnet/tessera/certificates/tessera_ca.key -sha256 -days 1024 -out tessera_ca.pem -subj "/C=US/ST=Washington/L=Seatle/O=Lnet/OU=Network/CN=Lnet CA"
  args:
    chdir: ~/lnet/tessera/certificates

- name: generating Tessera Certificate Key  
  shell: openssl genrsa -out tessera_cer.key 2048
  args:
    chdir: ~/lnet/tessera/certificates
    
- name: generating Certificate Signig Request
  shell: openssl req -new -key /root/lnet/tessera/certificates/tessera_cer.key -out tessera_cer.csr -subj "/C=US/ST=Washington/L=Seatle/O=Lnet/OU=Network/CN={{dns_name}}" -config /root/lnet/tessera/openssl.cnf
  args:
    chdir: ~/lnet/tessera/certificates

- name: Signing CSR using CA key
  shell: openssl x509 -req -in /root/lnet/tessera/certificates/tessera_cer.csr -CA /root/lnet/tessera/certificates/tessera_ca.pem -CAkey /root/lnet/tessera/certificates/tessera_ca.key -CAcreateserial -out tessera_cer.pem -days 500 -sha256 -extfile /root/lnet/tessera/openssl.cnf -extensions v3_req
  args:
    chdir: ~/lnet/tessera/certificates