---
- name: Rollback LACChain Relay Signer
  hosts: all
  user: root
  become: yes
  gather_facts: yes
  vars_prompt:
    - name: "confirm_rollback"
      prompt: "⚠️  Are you sure you want to rollback the Relay Signer? (yes/no)"
      default: "no"
      private: no
  tasks:
    - name: Abort if rollback not confirmed
      fail:
        msg: "Rollback aborted by user."
      when: confirm_rollback | lower != 'yes'

    - name: Check if this is a writer node with relay signer
      stat:
        path: "/root/lacchain/gas-relay-signer"
      register: relay_signer_check

    - name: Fail if relay signer is not installed
      fail:
        msg: "Relay Signer is not installed on this node. This playbook is only for nodes with relay signer already installed."
      when: not relay_signer_check.stat.exists

    - name: Display rollback information
      debug:
        msg:
          - "🔄 Starting Relay Signer rollback process"
          - "🏠 Installation path: /root/lacchain/gas-relay-signer"
          - "⚠️  This will restore the most recent backup"

    - name: Rollback Relay Signer
      include_tasks: "roles/lacchain-writer-node/tasks/rollback-relay-signer.yaml"

    - name: Display completion message
      debug:
        msg:
          - "✅ Relay Signer rollback completed!"
          - "🔍 Check service status with: systemctl status relaysigner"
          - "📝 View logs with: journalctl -u relaysigner -f"
          - "🗂️  Backup files are preserved for future rollbacks"
