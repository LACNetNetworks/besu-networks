---
- name: Checking if Relay Signer exists
  stat:
    path: "/root/lacchain/gas-relay-signer/config.toml"
  register: relay_signer

# testnet (open-protestnet): solo descargar el ejecutable desde la release, sin clonar el repo
- name: Ensure Relay Signer directory exists (testnet)
  file:
        path: "/root/lacchain/gas-relay-signer"
        state: directory
        mode: '0755'
  when: (networkT == '1' and not relay_signer.stat.exists)

- name: Download Relay Signer binary from release (testnet)
  get_url:
        url: "https://github.com/LACNetNetworks/gas-management/releases/download/{{ relay_signer_version }}/gas-relay-signer-linux-amd64"
        dest: "/root/lacchain/gas-relay-signer/gas-relay-signer"
        mode: '0755'
        force: true
  when: (networkT == '1' and not relay_signer.stat.exists)

# mainnet: sigue clonando el repo en v1.0.1 (sin cambios)
- name: Download Relay Signer code
  git:
        repo: "https://github.com/LACNetNetworks/gas-management.git"
        dest: "/root/lacchain/gas-relay-signer"
        version: v1.0.1
  when: (networkT == '0' and not relay_signer.stat.exists)

- name: semanage gas-relay-signer service on centos{{ansible_distribution_major_version}}
  shell: semanage fcontext -a -t bin_t '/root/lacchain/gas-relay-signer/gas-relay-signer'
  when: ((ansible_distribution |lower == 'centos' or ansible_distribution |lower == 'redhat' or ansible_distribution  |lower == 'rocky' or ansible_distribution |lower == 'oraclelinux') and ansible_distribution_major_version >= "8") 

- name: restorecon gas-relay-signer service on centos{{ansible_distribution_major_version}}
  shell: restorecon -Fv /root/lacchain/gas-relay-signer/gas-relay-signer
  when: ((ansible_distribution |lower == 'centos' or ansible_distribution |lower == 'redhat' or ansible_distribution  |lower == 'rocky' or ansible_distribution |lower == 'oraclelinux') and ansible_distribution_major_version >= "8") 



- name: Generate Relay Signer configuration file
  template:
    src: "relay-signer-config.j2"
    dest: "~/lacchain/gas-relay-signer/config.toml"
    mode: 0644
  when: not relay_signer.stat.exists 

- name: Get Key
  shell: cat ~/lacchain/data/key
  register: key
  when: not relay_signer.stat.exists
  no_log: true

# WRITER_KEY vía EnvironmentFile del propio servicio: /etc/profile.d solo aplica a shells de
# login interactivas, no llega al proceso arrancado por systemd.
- name: Ensure systemd drop-in dir for relaysigner env
  file:
    path: /etc/systemd/system/relaysigner.service.d
    state: directory
    mode: '0755'
  when: not relay_signer.stat.exists

- name: Write WRITER_KEY environment file (restricted permissions)
  copy:
    content: "WRITER_KEY={{ key.stdout }}\n"
    dest: /etc/systemd/system/relaysigner.service.d/writer-key.env
    mode: '0600'
    owner: root
    group: root
  when: not relay_signer.stat.exists
  no_log: true

- name: Configure relaysigner systemd override to load WRITER_KEY
  copy:
    content: |
      [Service]
      EnvironmentFile=/etc/systemd/system/relaysigner.service.d/writer-key.env
    dest: /etc/systemd/system/relaysigner.service.d/override.conf
    mode: '0644'
  when: not relay_signer.stat.exists

- name: Copy service file to systemd
  copy:
    src: "{{ role_path }}/files/relaysigner.service"
    dest: /lib/systemd/system/relaysigner.service
    mode: 0775
  when: not relay_signer.stat.exists

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  when: not relay_signer.stat.exists

- name: Enable service relaysigner
  service:
    name: relaysigner
    enabled: yes