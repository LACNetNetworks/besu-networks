---
- name: set mainnet as network chosen
  set_fact:
    network: "mainnet"
  when: (networkT == '0')

- name: set open-protestnet as network chosen
  set_fact:
    network: "openprotestnet"
  when: (networkT == '1')

- name: reject deprecated legacy-protestnet network
  fail:
    msg: "legacy-protestnet (networkT='2') was deprecated and removed. Choose mainnet-omega (0) or open-protestnet (1)."
  when: (networkT == '2')

- name: setting besu version (open-protestnet / testnet)
  set_fact:
    besu_release_version: "23.10.2"
  when: (networkT == '1')

- name: Deploying node
  debug:
    msg: You are deploying a BOOT on {{network}}

- name: Install Bootnode
  import_tasks: "install.yaml"
  when: install | default(False) | bool

- name: Update Bootnode
  import_tasks: "update.yaml"
  when: update | default(False) | bool
